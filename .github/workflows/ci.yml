---
name: Build & Test

on:
  push:
    branches: [main]
    tags:
      - v**
  merge_group:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm
  # renovate: datasource=git-refs depName=cucumber/messages packageName=https://github.com/cucumber/messages currentValue=main
  MESSAGES_REF: main
  # renovate: datasource=git-refs depName=cucumber/gherkin packageName=https://github.com/cucumber/gherkin currentValue=main
  GHERKIN_REF: main
  # renovate: datasource=git-refs depName=cucumber/query packageName=https://github.com/cucumber/query currentValue=feature/cpp
  QUERY_REF: feature/cpp
  # renovate: datasource=git-refs depName=cucumber/tag_expressions packageName=https://github.com/cucumber/tag_expressions currentValue=feature/cpp
  TAG_EXPRESSIONS_REF: feature/cpp
  # renovate: datasource=git-refs depName=cucumber/pretty_formatter packageName=https://github.com/cucumber/pretty_formatter currentValue=feature/cpp
  PRETTY_FORMATTER_REF: feature/cpp
  # renovate: datasource=git-refs depName=cucumber/cucumber_expressions packageName=https://github.com/cucumber/cucumber_expressions currentValue=feature/cpp
  CUCUMBER_EXPRESSIONS_REF: feature/cpp

jobs:
  build-in-devcontainer:
    name: Devcontainer Build
    runs-on: [ubuntu-latest]
    container: ghcr.io/philips-software/amp-devcontainer-cpp:8.1.0@sha256:740110a1a70c336d5b4a2770f84b9d856839ca90a04fec8f0300828e98cb9518
    strategy:
      matrix:
        target: [Host, Windows]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ matrix.target == 'Windows' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-winsdk
        with:
          path: /winsdk
          key: cache-winsdk-10.0.26100-14.43.17.13

      - if: ${{ matrix.target == 'Windows' && steps.cache-winsdk.outputs.cache-hit != 'true' }}
        run: ./get-winsdk.sh

      - if: ${{ matrix.target == 'Windows' && steps.cache-winsdk.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /winsdk
          key: cache-winsdk-10.0.26100-14.43.17.13

      - name: Build
        uses: ./.github/actions/build
        with:
          cpm-source-cache: ${{ env.CPM_SOURCE_CACHE }}
          use-ccache: true
          ccache-key: ${{ github.job }}-${{ matrix.target }}
          configure-preset: "${{ matrix.target}}"
          build-preset: "${{ matrix.target}}-Release"

  test-linux:
    name: Acceptance Test on Linux
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    container: ghcr.io/philips-software/amp-devcontainer-cpp:8.1.0@sha256:740110a1a70c336d5b4a2770f84b9d856839ca90a04fec8f0300828e98cb9518
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build
        with:
          cpm-source-cache: ${{ env.CPM_SOURCE_CACHE }}
          use-ccache: true
          ccache-key: ${{ github.job }}
          configure-preset: "Host"
          build-preset: "Host-Debug"

      - run: |
          bats --formatter junit cucumber_cpp/acceptance_test/test.bats | tee test-report.xml

      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: test-report.xml

  host_build_test:
    name: Host Build & Test
    runs-on: ${{ matrix.os }}-${{ matrix.version}}
    strategy:
      matrix:
        os: [macos, windows, ubuntu]
        version: [latest]
        type: [synchronous]
        preset_suffix: ["", "-no-re2"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        uses: ./.github/actions/workflow
        with:
          cpm-source-cache: ${{ env.CPM_SOURCE_CACHE }}
          use-ccache: ${{ !startsWith(matrix.os, 'windows') }}
          ccache-key: ccache-${{ github.job }}-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.type }}${{ matrix.preset_suffix }}
          workflow-preset: "${{ matrix.os }}-Debug-${{ matrix.type }}${{ matrix.preset_suffix }}"

      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs
          path: .build/${{ matrix.os }}-Debug-${{ matrix.type }}${{ matrix.preset_suffix }}/Testing/Temporary/

  test-cpp-system-packages-linux:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04, cxx: g++, version: 12 }
          - { os: ubuntu-24.04, cxx: g++, version: 13 }
          - { os: ubuntu-24.04, cxx: clang++, version: 16 }
          - { os: ubuntu-24.04, cxx: clang++, version: 17 }
          - { os: ubuntu-26.04, cxx: g++, version: 14 }
          - { os: ubuntu-26.04, cxx: g++, version: 15 }
          - { os: ubuntu-26.04, cxx: clang++, version: 21 }
          - { os: ubuntu-26.04, cxx: clang++, version: 22 }
    env:
      CXX: ${{ matrix.config.cxx }}-${{ matrix.config.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ matrix.config.os }}-${{ matrix.config.cxx }}-${{ matrix.config.version }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev libgtest-dev libgmock-dev libabsl-dev libre2-dev

      # Ubuntu 24.04 ships fmt 9; newer runners provide fmt 10+ via apt.
      - name: Install libfmt (apt)
        if: matrix.config.os != 'ubuntu-24.04'
        run: sudo apt-get install -y libfmt-dev

      - name: Checkout libfmt
        if: matrix.config.os == 'ubuntu-24.04'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: fmtlib/fmt
          ref: 10.2.1
          path: fmt-src
          persist-credentials: false

      - name: Install libfmt (from source)
        if: matrix.config.os == 'ubuntu-24.04'
        run: |
          cmake -S fmt-src -B fmt-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build fmt-src/build
          sudo cmake --install fmt-src/build

      - name: Install cucumber/tag_expressions
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/tag_expressions
          ref: ${{ env.TAG_EXPRESSIONS_REF }}

      - name: Install cucumber/cucumber_expressions
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/cucumber_expressions
          ref: ${{ env.CUCUMBER_EXPRESSIONS_REF }}

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/gherkin
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/gherkin
          ref: ${{ env.GHERKIN_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Install cucumber/pretty_formatter
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/pretty_formatter
          ref: ${{ env.PRETTY_FORMATTER_REF }}

      - name: Build and unit test
        run: cmake --workflow --preset test-system

  test-cpp-system-packages-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ github.job }}-${{ github.ref }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: brew install googletest nlohmann-json fmt abseil re2

      - name: Install cucumber/tag_expressions
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/tag_expressions
          ref: ${{ env.TAG_EXPRESSIONS_REF }}

      - name: Install cucumber/cucumber_expressions
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/cucumber_expressions
          ref: ${{ env.CUCUMBER_EXPRESSIONS_REF }}

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/gherkin
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/gherkin
          ref: ${{ env.GHERKIN_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Install cucumber/pretty_formatter
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/pretty_formatter
          ref: ${{ env.PRETTY_FORMATTER_REF }}

      - name: Build and unit test
        run: cmake --workflow --preset test-system

  test-cpp-system-packages-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Install build tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install gtest nlohmann-json fmt abseil re2 --triplet x64-windows
          # Expose the vcpkg toolchain so find_package() locates the packages.
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Install cucumber/tag_expressions
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/tag_expressions
          ref: ${{ env.TAG_EXPRESSIONS_REF }}

      - name: Install cucumber/cucumber_expressions
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/cucumber_expressions
          ref: ${{ env.CUCUMBER_EXPRESSIONS_REF }}

      - name: Install cucumber/messages
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/messages
          ref: ${{ env.MESSAGES_REF }}

      - name: Install cucumber/gherkin
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/gherkin
          ref: ${{ env.GHERKIN_REF }}

      - name: Install cucumber/query
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/query
          ref: ${{ env.QUERY_REF }}

      - name: Install cucumber/pretty_formatter
        uses: cucumber/ci-actions/install-cpp-dep@9ba4a623ec838b1358e18683a85a0914f3779363
        with:
          repository: cucumber/pretty_formatter
          ref: ${{ env.PRETTY_FORMATTER_REF }}
      - name: Build and unit test
        run: cmake --workflow --preset test-system
