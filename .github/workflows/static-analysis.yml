---
name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-26.04
    env:
      SONAR_SERVER_URL: "https://sonarcloud.io"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone to enable blame information
          persist-credentials: false

      - name: Install bats
        run: |
          sudo apt-get update && sudo apt-get install -y bats bats-support bats-assert
          python -m pip install gcovr==8.6

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu
          os-version: 26.04

      - name: Build host
        uses: ./.github/actions/build
        with:
          ccache-key: ${{ github.job }}
          use-ccache: true
          workflow-preset: coverage
        env:
          GTEST_OUTPUT: "xml:${{ github.workspace }}/testresults/"

      - uses: philips-software/sonarqube-issue-conversion@9e9958764ba5fd1d302b039779dc902bedfa4d01 # v1.2.0
        with:
          input: ${{ github.workspace }}/.build/coverage/sonarqube.xml
          output: execution.xml
          transformation: gtest-to-generic-execution

      - name: Convert results
        run: |
          cp .build/coverage/compile_commands.json compile_commands.json
          cp .build/coverage/sonarqube.xml sonarqube.xml

      - uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Show coverage summary
        run: cat .build/coverage/coverage-summary.md

  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu
          os-version: 26.04

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: cpp

      - name: Build host
        uses: ./.github/actions/build
        with:
          ccache-key: ${{ github.job }}
          use-ccache: true
          workflow-preset: host-system

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
