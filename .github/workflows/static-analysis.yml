---
name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  GTEST_COLOR: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-26.04
    env:
      SONAR_SERVER_URL: "https://sonarcloud.io"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone to enable blame information
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: 7d

      - name: Install gcovr
        run: python -m pip install gcovr==8.6

      - name: Build host
        uses: ./.github/actions/build
        with:
          workflow-preset: coverage
        env:
          GTEST_OUTPUT: "xml:${{ github.workspace }}/testresults/"

      - uses: philips-software/sonarqube-issue-conversion@9e9958764ba5fd1d302b039779dc902bedfa4d01 # v1.2.0
        with:
          input: ${{ github.workspace }}/.build/coverage/sonarqube.xml
          output: execution.xml
          transformation: gtest-to-generic-execution

      - name: Convert results
        run: |
          cp .build/coverage/compile_commands.json compile_commands.json
          cp .build/coverage/sonarqube.xml sonarqube.xml

      - uses: sonarsource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Show coverage summary
        run: cat .build/coverage/coverage-summary.md

  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: 7d

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          os: ubuntu
          os-version: 26.04

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: cpp

      - name: Build host
        uses: ./.github/actions/build
        with:
          workflow-preset: host-system

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
